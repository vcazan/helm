name: Helm
configFiles:
  Debug: Config/Helm.xcconfig
  Release: Config/Helm.xcconfig
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Helm:
    type: application
    platform: iOS
    sources:
      - Helm
      - Shared
      - HelmWidgets/HelmWidgets.swift
    dependencies:
      - target: HelmWidgets
    entitlements:
      path: Helm/Helm.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HELM_BUNDLE_PREFIX).helm
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Helm/Info.plist
      properties:
        CFBundleDisplayName: Helm
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, JetBrainsMono-Regular.ttf, JetBrainsMono-Medium.ttf]
        NSCameraUsageDescription: Helm scans the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: Helm connects to the hub running on your Mac.
        NSPhotoLibraryUsageDescription: Attach screenshots and images to messages for your agents.
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [helm]

  HelmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HelmWidgets
      - Shared
      - path: Helm/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HELM_BUNDLE_PREFIX).helm.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXT"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: HelmWidgets/Info.plist
      properties:
        CFBundleDisplayName: Helm
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, JetBrainsMono-Regular.ttf, JetBrainsMono-Medium.ttf]
